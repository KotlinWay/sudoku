plugins { id 'com.android.application' }

// Боевой ключ подключается файлом `keystore.properties` в корне репозитория — он в .gitignore.
// Файла нет (чужая машина, CI, свежий клон) — release собирается неподписанным, и это
// намеренно: debug-ключ здесь стоял для замеров размера, а в магазин с ним уходить нельзя.
// Он одинаковый у всех разработчиков мира, то есть обновление к приложению сможет
// выпустить кто угодно.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'info.javaway.sudoku'
    compileSdk 36

    defaultConfig {
        applicationId "info.javaway.sudoku"
        // 23, а не 21: с этого уровня цвет значка на кнопке задаётся разметкой
        // (`android:drawableTint` плюс ColorStateList). Ниже пришлось бы перекрашивать
        // значки кодом на каждой отрисовке — ровно та точечная правка интерфейса мимо
        // состояния, которую проект запрещает. Android 6 вышел в 2015 году.
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        if (keystoreProps.containsKey('storeFile')) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProps.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures { buildConfig true }

    packaging {
        // R8 кладёт в APK свои kotlin_builtins-ресурсы, хотя Kotlin в проекте нет.
        resources { excludes += ['kotlin/**'] }
    }
}

// Ни одной runtime-зависимости: всё, что нужно судоку, есть в платформе.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
